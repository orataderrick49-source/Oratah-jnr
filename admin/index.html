<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Oratah Jnr Gold</title><style>
body{background:#0e0c08;color:#f5e8c7;font-family:sans-serif;padding:14px}
h1{color:#ffd700;letter-spacing:2px;font-size:20px}
.card{background:#1c1a12;border:1px solid #2a2416;border-radius:14px;padding:12px;margin:10px 0;display:flex;justify-content:space-between;align-items:center}
.badge{padding:4px 8px;border-radius:8px;font-size:10px;font-weight:800}
.pending{background:#3a2f00;color:#ffd700}.done{background:#0a2e15;color:#4ade80}
button{background:linear-gradient(135deg,#ffd700,#d4af37);border:none;padding:6px 12px;border-radius:8px;font-weight:800}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
</style></head><body>
<div class="top"><h1>👑 ADMIN GOLD</h1><div><span id="total"></span></div></div>
<div id="orders">Loading orders...</div>
<script>
function load(){fetch('/api/orders').then(r=>r.json()).then(d=>{
  document.getElementById('total').innerText=d.length+' orders | KES '+d.reduce((s,o)=>s+o.profit,0)+' profit';
  document.getElementById('orders').innerHTML=d.map(o=>`<div class=card><div><b>${o.phone}</b><br><small>${o.bundle} - KES ${o.price}</small><br><small>${o.time}</small></div><div style=text-align:right><div class=badge ${o.status=='DONE'?'done':'pending'}>${o.status}</div><div style=margin-top:6px;font-size:11px;color:#4ade80>Profit KES ${o.profit}</div>${o.status=='PENDING'?`<button onclick="mark(${o.id})">MARK DONE</button>`:''}</div></div>`).join('')||'No orders yet';
})}
function mark(id){fetch('/api/orders/done',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})}).then(()=>load())}
load();setInterval(load,3000);
</script></body></html>
