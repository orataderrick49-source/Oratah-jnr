<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Oratah</title><style>body{font-family:sans-serif;background:#FAF6F1;margin:0} .top{padding:14px;display:flex;justify-content:space-between;border-bottom:1px solid #E8DDD0;background:#fff} .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px} .stat{border:1px solid #E8DDD0;border-radius:12px;padding:12px;background:#fff} table{width:100%;border-collapse:collapse;background:#fff} th{font-size:10px;color:#888;padding:8px;text-align:left} td{padding:8px;font-size:13px;border-top:1px solid #eee} .login{position:fixed;inset:0;background:#FAF6F1;display:grid;place-items:center;z-index:99} .box{border:1px solid #E8DDD0;border-radius:16px;padding:20px;background:#fff;width:90%;max-width:300px;text-align:center} .inp{width:100%;padding:10px;border-radius:8px;border:1px solid #E8DDD0;margin:6px 0} .btn{padding:8px 14px;border-radius:20px;border:1px solid #E8DDD0;background:#fff;cursor:pointer} .btn-b{background:#000;color:#fff}</style></head><body>
<div id="L" class="login"><div class="box"><b>ORATAH JNR ADMIN</b><br><small>0791 102687</small><input id="u" class="inp" placeholder="admin"><input id="p" class="inp" type="password" placeholder="admin"><button class="btn btn-b" style="width:100%" onclick="if(u.value=='admin'&&p.value=='admin'){L.style.display='none';load()}else alert('admin/admin')">Enter</button></div></div>
<div class="top"><b>ORATAH ADMIN</b><div><button class="btn" onclick="exportCSV()">Export</button> <button class="btn btn-b" onclick="if(confirm('Clear?')){localStorage.removeItem('oratah_tx');location.reload()}">Clear</button></div></div>
<div class="stats"><div class="stat"><small>TOTAL</small><br><b id="a">KES 0</b><br><small id="b">0 tx</small></div><div class="stat"><small>WALLET</small><br><b id="c">KES 0</b></div><div class="stat"><small>TODAY</small><br><b id="d">KES 0</b></div><div class="stat"><small>M-PESA</small><br><b>0791 102687</b></div></div>
<div style="padding:14px"><h3>Transactions</h3><table><thead><tr><th>DATE</th><th>BUNDLE</th><th>PHONE</th><th>AMOUNT</th></tr></thead><tbody id="T"></tbody></table></div>
<script>
let tx=JSON.parse(localStorage.getItem('oratah_tx')||'[]');
let w=parseFloat(localStorage.getItem('oratah_premium')||localStorage.getItem('oratah_wallet')||'0');
function load(){let total=tx.reduce((x,y)=>x+y.amount,0);let today=new Date().toDateString();let todayTx=tx.filter(t=>new Date(t.date).toDateString()===today);a.textContent='KES '+total.toLocaleString();b.textContent=tx.length+' tx';c.textContent='KES '+w.toLocaleString();d.textContent='KES '+todayTx.reduce((x,y)=>x+y.amount,0).toLocaleString();T.innerHTML=tx.slice().reverse().map(t=>`<tr><td>${new Date(t.date).toLocaleString()}</td><td>${t.bundle}</td><td>${t.phone}</td><td>KES ${t.amount}</td></tr>`).join('')||'<tr><td colspan=4 style="text-align:center;padding:20px;color:#999">No data yet - buy bundle on main site first</td></tr>'}
function exportCSV(){let csv='Date,Bundle,Phone,Amount\n'+tx.map(t=>`${t.date},${t.bundle},${t.phone},${t.amount}`).join('\n');let blob=new Blob([csv],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sales.csv';a.click()}
load();
</script></body></html>
