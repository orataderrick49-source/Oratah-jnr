<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORATAH JNR DATA SOLUTION</title><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#0a0906;color:#f5e8c7;padding-bottom:90px}
.top{background:linear-gradient(135deg,#1a1500 0%,#d4af37 55%,#ffd700 100%);padding:22px 16px;display:flex;justify-content:space-between;align-items:center;border-radius:0 0 24px 24px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.top h1{color:#000;font-weight:900;letter-spacing:2px;line-height:1;font-size:22px}.top small{color:#1a1500;font-weight:700;letter-spacing:2px;font-size:9px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 12px;position:sticky;top:0;background:#0a0906;z-index:10}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;padding:10px 16px;border-radius:22px;border:1px solid #2a2416;background:#1c1a12;color:#8a7d5e;font-weight:800;font-size:11px;flex-shrink:0}
.tab.active{background:linear-gradient(135deg,#ffd700,#d4af37);color:#000;border-color:#ffd700}
.input{width:92%;margin:12px 4%;padding:16px 14px;border-radius:14px;border:1px solid #2e2712;background:#1a180f;color:#ffd700;outline:none;font-size:16px}
.hint{text-align:center;color:#6b5e3a;font-size:11px;letter-spacing:1px;margin:8px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:radial-gradient(100% 100% at 0% 0%,#2a2416 0%,#1c1a12 60%,#12100c 100%);border:1px solid #3a2f14;border-radius:18px;padding:14px;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;width:38px;height:38px;background:linear-gradient(135deg,#ffd700,#b8941f);clip-path:polygon(0 0,100% 0,0 100%)}
.card b{font-size:12px;line-height:1.2;display:block;margin-top:8px;min-height:28px}
.price{color:#ffd700;font-weight:900;font-size:17px;margin:8px 0 10px}
.btn{width:100%;background:linear-gradient(135deg,#ffe27a 0%,#ffd700 20%,#d4af37 100%);border:none;padding:11px;border-radius:11px;font-weight:900;font-size:13px;color:#000;box-shadow:0 4px 12px rgba(212,175,55,.3)}
.btn:active{transform:scale(.96)}
.meta{font-size:10px;color:#8a7d5e;margin-bottom:2px}
.badge{position:absolute;top:8px;right:8px;font-size:7px;background:#ffd700;color:#000;padding:3px 6px;border-radius:6px;font-weight:900}
</style></head><body>
<div class="top"><div><h1>ORATAH JNR DATA SOLUTION</h1><small>GOLD • ORIGINAL 30 OFFERS</small></div><div style="font-size:20px">🔔 👤</div></div>
<div class="tabs" id="tabs"></div>
<input class="input" id="phone" placeholder="Phone / Meter / IUC • 07XX">
<div class="hint">CHOOSE YOUR BUNDLE • 24HR & 7DAY OPTIONS</div>
<div class="grid" id="list">Loading...</div>
<script>
let all=[], active='affordable';
const cats=['affordable','safaricom','airtel','airtime','kplc','tv','betting','sms'];
const labels={affordable:'Affordable 🔥',safaricom:'Bingwa',airtel:'Airtel',airtime:'Airtime',kplc:'KPLC',tv:'TV',betting:'Betting',sms:'SMS'};
function renderTabs(){
 document.getElementById('tabs').innerHTML=cats.map(c=>`<div class="tab ${c==active?'active':''}" onclick="setTab('${c}')">${labels[c]||c}</div>`).join('');
}
function setTab(c){active=c;renderTabs();render()}
fetch('/api/bundles').then(r=>r.json()).then(d=>{
 all=d;
 // if affordable not in backend, still show safaricom first
 if(!all.some(x=>x.cat=='affordable')) active='safaricom';
 renderTabs();render();
});
function render(){
 const f=all.filter(x=>x.cat==active);
 if(!f.length){document.getElementById('list').innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:30px;color:#6b5e3a">No offers in ${active}</div>`;return}
 document.getElementById('list').innerHTML=f.map(b=>`
  <div class="card">
    <div class="meta">${b.time} • ${b.gb}</div>
    <b>${b.name}</b>
    <div class="price">KES ${b.price}</div>
    <button class="btn" onclick="buy(${b.id})">PAY</button>
  </div>`).join('');
}
function buy(id){
 let p=document.getElementById('phone').value;
 if(p.length<8){alert('Enter Phone / Meter / IUC');return}
 fetch('/api/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:p,bundleId:id})}).then(()=>alert('👑 ORDER OK: '+p));
}
</script></body></html>
