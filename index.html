<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oratah Jnr - Lipa Bila Stress</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#0f0f0f;color:#fff;padding:20px}
h1{color:#facc15;text-align:center;margin:10px 0}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:20px 0;padding-bottom:5px}
.tab{padding:10px 18px;background:#222;border-radius:20px;white-space:nowrap;cursor:pointer;border:1px solid #333}
.tab.active{background:#facc15;color:#000;font-weight:bold}
.panel{display:none;background:#1a1a1a;padding:20px;border-radius:15px}
.panel.active{display:block}
input,button{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:none}
input{background:#222;color:#fff}
button{background:#facc15;color:#000;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<h1>ORATAH JNR</h1>
<p style="text-align:center;color:#aaa">Lipa Bila Stress</p>

<div class="tabs">
<div class="tab active" onclick="showTab('airtime')">Airtime</div>
<div class="tab" onclick="showTab('kplc')">KPLC</div>
<div class="tab" onclick="showTab('rent')">Rent</div>
<div class="tab" onclick="showTab('tv')">TV</div>
<div class="tab" onclick="showTab('water')">Water</div>
</div>

<div id="airtime" class="panel active">
<h3>Airtime</h3>
<input placeholder="Phone Number">
<input placeholder="Amount">
<button>Lipa Airtime</button>
</div>

<div id="kplc" class="panel">
<h3>KPLC Token</h3>
<input placeholder="Meter Number">
<input placeholder="Amount">
<button>Lipa KPLC</button>
</div>

<div id="rent" class="panel">
<h3>Rent</h3>
<input placeholder="House No">
<input placeholder="Amount">
<button>Lipa Rent</button>
</div>

<div id="tv" class="panel">
<h3>TV - DSTV/GOTV</h3>
<input placeholder="Smartcard">
<input placeholder="Amount">
<button>Lipa TV</button>
</div>

<div id="water" class="panel">
<h3>Water Bill</h3>
<input placeholder="Account No">
<input placeholder="Amount">
<button>Lipa Maji</button>
</div>

<script>
function showTab(id){
document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
document.getElementById(id).classList.add('active');
event.target.classList.add('active');
}
</script>
</body>
</html>
