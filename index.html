<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORATAH JNR NETWORKS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
body{background:#080808;color:#fff}
.header{position:sticky;top:0;z-index:999;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:rgba(10,10,10,0.85);backdrop-filter:blur(15px);border-bottom:1px solid rgba(255,215,0,0.15)}
.header-left{display:flex;align-items:center;gap:10px}
.header-left img{height:42px;width:42px;border-radius:10px;background:#111}
.copy-btn{background:#FFC300;border:none;padding:9px 16px;border-radius:25px;font-weight:800;cursor:pointer}
.banner{background:linear-gradient(135deg,#FFC300,#FFD60A);color:#000;padding:22px 16px;text-align:center}
.banner h1{font-size:26px;font-weight:900}
.tabs{display:flex;gap:10px;padding:14px 12px;overflow-x:auto;background:#0a0a0a}
.tab{padding:10px 20px;border-radius:25px;border:1.5px solid rgba(255,195,0,0.4);background:transparent;color:#FFC300;font-weight:600;white-space:nowrap}
.tab.active{background:#FFC300;color:#000}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:rgba(255,255,255,0.07);backdrop-filter:blur(12px);border:1px solid rgba(255,215,0,0.22);border-radius:18px;padding:18px 14px;text-align:center;transition:0.3s;box-shadow:0 8px 32px rgba(0,0,0,0.4)}
.card:hover{transform:translateY(-6px);box-shadow:0 0 28px rgba(255,195,0,0.35);border-color:#FFC300}
.price{font-size:32px;font-weight:900;color:#FFC300;margin:8px 0}
.buy{background:#FFC300;color:#000;border:none;width:100%;padding:12px;border-radius:25px;font-weight:800;font-size:15px;cursor:pointer}
</style>
</head>
<body>
<div class="header">
  <div class="header-left"><img src="logo.png"><b>ORATAH JNR</b></div>
  <button class="copy-btn" onclick="navigator.clipboard.writeText('YOUR_TILL');alert('Till Copied!')">Copy Till 📋</button>
</div>
<div class="banner"><h1>ORATAH JNR NETWORKS</h1><p>⚡ Fast • ✅ Reliable • 🔒 Trusted</p></div>
<div class="tabs"><button class="tab active">Data</button><button class="tab">Airtime</button><button class="tab">KPLC</button><button class="tab">Bills</button></div>
<div class="grid">
  <div class="card"><h3>1GB 1hour</h3><div class="price">19</div><button class="buy">Buy Now</button></div>
  <div class="card"><h3>2GB Daily</h3><div class="price">50</div><button class="buy">Buy Now</button></div>
  <div class="card"><h3>2hours unlimited</h3><div class="price">35</div><button class="buy">Buy Now</button></div>
  <div class="card"><h3>1GB 3Days</h3><div class="price">50</div><button class="buy">Buy Now</button></div>
</div>
</body>
</html>
