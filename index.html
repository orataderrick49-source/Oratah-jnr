<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Full</title>
<style>
body{margin:0;background:#070f2a;color:#fff;font-family:system-ui}
header{background:#0f1c44;padding:16px;display:flex;justify-content:space-between;align-items:center}
.card{background:#16265a;border-radius:18px;padding:18px;margin:10px;border:1px solid #22366e}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:20px}
table{width:100%;border-collapse:collapse}th{color:#8ea2d6;padding:10px;text-align:left}td{padding:10px;border-top:1px solid #15265a}
input,select{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #23408a;background:#0a1538;color:#fff}
button{padding:12px;border-radius:20px;border:0;font-weight:800}
.btn-gold{background:#ffd700;color:#000;width:100%}
.section{background:#0f1c44;margin:12px;border-radius:18px;padding:18px}
</style>
</head>
<body>
<header><h2 style="color:#ffd700;margin:0">ORATAH JNR ADMIN</h2><a href="index.html" style="color:#ffd700">Customer</a></header>
<div class="grid">
<div class="card"><b id="rev" style="font-size:24px;color:#ffd700">KES 0</b><br>Total Revenue</div>
<div class="card"><b id="sales" style="font-size:24px;color:#ffd700">0</b><br>Total Sales</div>
<div class="card"><b id="users" style="font-size:24px;color:#ffd700">0</b><br>Active Users</div>
<div class="card"><b id="mpesa" style="font-size:24px;color:#ffd700">0</b><br>Mpesa Pending</div>
</div>
<div class="section"><h3 style="color:#ffd700">Packages</h3><div id="pkgBody">Loading...</div><input id="pName" placeholder="Name"><input id="pPrice" placeholder="Price"><button class="btn-gold" onclick="addPkg()">Add Package</button></div>
<div class="section"><h3 style="color:#ffd700">Mpesa Transactions</h3><table><tr><th>Phone</th><th>Amount</th><th>Code</th></tr><tbody id="mpBody"><tr><td colspan=3 style="text-align:center;color:gray">No data yet</td></tr></tbody></table></div>
<div class="section"><h3 style="color:#ffd700">Users</h3><table><tr><th>Phone</th><th>Bundle</th><th>Status</th></tr><tbody id="userBody"><tr><td colspan=3 style="text-align:center;color:gray">No users yet</td></tr></tbody></table></div>
<script>
let pkgs=JSON.parse(localStorage.getItem('oratah_packages')||'[]');
if(pkgs.length==0){pkgs=[{name:'1GB Daily',price:19},{name:'5GB Weekly',price:99},{name:'10GB Monthly',price:299}];localStorage.setItem('oratah_packages',JSON.stringify(pkgs));}
function loadPkg(){let h='';pkgs.forEach((p,i)=>{h+=p.name+' - KES '+p.price+' <button onclick="delPkg('+i+')">Del</button><br>';});document.getElementById('pkgBody').innerHTML=h;}
function addPkg(){let n=document.getElementById('pName').value,p=document.getElementById('pPrice').value;if(!n||!p)return alert('fill');pkgs.push({name:n,price:p});localStorage.setItem('oratah_packages',JSON.stringify(pkgs));loadPkg();}
function delPkg(i){pkgs.splice(i,1);localStorage.setItem('oratah_packages',JSON.stringify(pkgs));loadPkg();}
loadPkg();
</script>
</body>
</html>
